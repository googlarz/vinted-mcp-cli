name: Live smoke

# Unit tests mock Vinted, so they cannot notice when Vinted changes its site.
# This job hits the real site weekly; a failure means "check whether Vinted changed something".
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
