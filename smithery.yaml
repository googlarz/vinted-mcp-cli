startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      proxyUrl:
        type: string
        title: Proxy URL
        description: >
          HTTP/HTTPS proxy URL for countries where Vinted blocks direct connections
          (e.g. some residential IPs). Also readable from the VINTED_PROXY_URL env var.
      cacheTtlMs:
        type: number
        title: Cache TTL (ms)
        description: >
          How long to cache API responses in memory (milliseconds). Default 60000 (1 min).
          Set to 0 to disable caching. Static catalogues (colors, sizes, categories) are
          always cached for 1 hour regardless of this setting.
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@googlarz/vinted-client/mcp"],
      env: {
        ...(config.proxyUrl ? { VINTED_PROXY_URL: config.proxyUrl } : {}),
        ...(config.cacheTtlMs !== undefined ? { VINTED_CACHE_TTL_MS: String(config.cacheTtlMs) } : {}),
      }
    })
